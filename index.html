<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <title>Tasks — Task Manager</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20232b;
        background: #f5f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 64px 20px;
      }

      main {
        width: min(100%, 620px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #626b7a;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.7rem);
        letter-spacing: -0.055em;
      }

      .intro {
        margin: 10px 0 30px;
        color: #626b7a;
        line-height: 1.6;
      }

      .task-form,
      .task-list {
        border: 1px solid #e4e7ec;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 28px rgb(34 42 53 / 5%);
      }

      .task-form {
        display: flex;
        gap: 12px;
        padding: 14px;
      }

      .task-form input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        padding: 0 8px;
        color: inherit;
        font: inherit;
      }

      .task-form input::placeholder {
        color: #9299a5;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        padding: 0 18px;
        background: #5b55e7;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        transition: background 150ms ease, transform 150ms ease;
      }

      button:hover {
        background: #4842ce;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #aaa7ff;
        outline-offset: 3px;
      }

      .list-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 32px 2px 12px;
      }

      h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      #task-count {
        color: #747d8b;
        font-size: 0.88rem;
      }

      .task-list {
        margin: 0;
        padding: 0 18px;
        list-style: none;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        border-bottom: 1px solid #edf0f3;
      }

      .task-item:last-child {
        border-bottom: 0;
      }

      .task-item input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: #5b55e7;
        cursor: pointer;
      }

      .task-item label {
        flex: 1;
        overflow-wrap: anywhere;
        cursor: pointer;
      }

      .task-item.is-complete label {
        color: #89909c;
        text-decoration: line-through;
      }

      .empty-state {
        padding: 28px 8px;
        color: #747d8b;
        text-align: center;
      }

      .empty-state[hidden] {
        display: none;
      }

      @media (max-width: 480px) {
        body {
          padding: 40px 16px;
        }

        .task-form {
          gap: 6px;
          padding: 10px;
        }

        .task-form button {
          padding: 0 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your workspace</p>
      <h1>My tasks</h1>
      <p class="intro">A little progress adds up. What would you like to get done?</p>

      <form class="task-form" id="task-form">
        <label for="task-input" class="visually-hidden">New task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="e.g. Plan the week"
          maxlength="200"
          autocomplete="off"
          required
        >
        <button type="submit">Add task</button>
      </form>

      <div class="list-heading">
        <h2>Tasks</h2>
        <span id="task-count" aria-live="polite">0 tasks</span>
      </div>
      <ul class="task-list" id="task-list" aria-label="Task list"></ul>
      <p class="empty-state" id="empty-state">No tasks yet. Add one to get started.</p>
    </main>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }
    </style>
    <script>
      const taskForm = document.querySelector("#task-form");
      const taskInput = document.querySelector("#task-input");
      const taskList = document.querySelector("#task-list");
      const taskCount = document.querySelector("#task-count");
      const emptyState = document.querySelector("#empty-state");
      let nextTaskId = 0;

      function updateTaskSummary() {
        const count = taskList.children.length;
        taskCount.textContent = `${count} ${count === 1 ? "task" : "tasks"}`;
        emptyState.hidden = count > 0;
      }

      function addTask(text) {
        const item = document.createElement("li");
        const checkbox = document.createElement("input");
        const label = document.createElement("label");
        const id = `task-${nextTaskId++}`;

        item.className = "task-item";
        checkbox.type = "checkbox";
        checkbox.id = id;
        label.htmlFor = id;
        label.textContent = text;

        checkbox.addEventListener("change", () => {
          item.classList.toggle("is-complete", checkbox.checked);
        });

        item.append(checkbox, label);
        taskList.append(item);
        updateTaskSummary();
      }

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = taskInput.value.trim();

        if (!text) {
          taskInput.focus();
          return;
        }

        addTask(text);
        taskForm.reset();
        taskInput.focus();
      });

      updateTaskSummary();
    </script>
  </body>
</html>
